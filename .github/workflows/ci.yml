name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: Lint, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Syntax check
        run: npm run check

      - name: Unit & API tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Boot the server and hit /api/health
        run: |
          node server.js &
          sleep 2
          curl -fsS http://localhost:3000/api/health | grep -q '"status":"up"'
