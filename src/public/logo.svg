<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7b68ee" />
      <stop offset="100%" stop-color="#a89cf7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Circle with Gradient border -->
  <circle cx="256" cy="256" r="230" fill="#0f0f18" stroke="url(#grad)" stroke-width="12" />
  <!-- Inner dark background -->
  <circle cx="256" cy="256" r="190" fill="#08080e" />
  <!-- 'A' Symbol -->
  <text x="256" y="330" font-family="'Syne', 'Arial Black', sans-serif" font-weight="900" font-size="200" fill="url(#grad)" text-anchor="middle" filter="url(#glow)">A</text>
</svg>
